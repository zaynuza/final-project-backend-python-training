# Alert dari SLI yang melewati SLO (Sesi 9), ditambah alert untuk fitur final project.
# SLO Order API:
#   availability : >= 99.5% request tidak 5xx
#   latency      : >= 95% request selesai di bawah 300 ms
# "for" = kondisinya harus bertahan selama itu dulu, supaya lonjakan sesaat tidak memicu alert.
# Lihat alert yang aktif di http://localhost:9090/alerts
groups:
  - name: order-api-slo
    rules:
      - alert: OrderApiAvailabilityBelowSLO
        expr: |
          sum(rate(http_requests_total{job="order-api", status!~"5.."}[5m]))
            / sum(rate(http_requests_total{job="order-api"}[5m])) < 0.995
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Availability Order API di bawah 99.5%"

      - alert: OrderApiLatencyBelowSLO
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="order-api", le="0.3"}[5m]))
            / sum(rate(http_request_duration_seconds_count{job="order-api"}[5m])) < 0.95
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Kurang dari 95% request Order API selesai di bawah 300 ms"

      - alert: OrderApiDown
        expr: up{job="order-api"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus tidak bisa mengambil /metrics dari Order API"

  - name: order-events
    rules:
      - alert: EventPublishFailed
        # Event dikirim setelah commit. Kalau RabbitMQ gagal, order tersimpan tapi event hilang (ADR 0008).
        expr: increase(events_published_total{result="failed"}[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Event order gagal dikirim ke RabbitMQ: notifikasi dan poin ada yang tidak terkirim"

      - alert: NotificationDeadLettered
        expr: increase(notifications_processed_total{result="dead_lettered"}[10m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Ada notifikasi yang masuk DLQ, perlu dicek manual"

      - alert: PointsDeadLettered
        expr: increase(points_events_processed_total{result="dead_lettered"}[10m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Ada event poin yang masuk points.dlq, perlu dicek manual"

  - name: order-security
    rules:
      - alert: LoginBruteForceSuspected
        # Banyak login gagal dalam waktu singkat = tebak password (brute force) atau credential stuffing.
        expr: increase(login_failures_total{job="order-api"}[5m]) > 20
        labels:
          severity: ticket
        annotations:
          summary: "Lebih dari 20 login gagal dalam 5 menit, kemungkinan serangan tebak password"
