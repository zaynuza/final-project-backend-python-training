# Prometheus mengambil (scrape) /metrics setiap 5 detik. Nama host = nama service di docker compose.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: order-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: notification-consumer
    static_configs:
      - targets: ["consumer:8001"]          # start_http_server di consumer notifikasi

  - job_name: points-consumer
    static_configs:
      - targets: ["points-consumer:8002"]   # start_http_server di consumer poin
